# Particionado por defecto: swap pequeña (calamares-settings-debian reservaba 8 GiB de swap en un
# disco de 25 GiB y dejaba la raíz sin espacio) y LUKS1 cuando se marca "Cifrar sistema".
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 300MiB
userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: small
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
# luks1: GRUB 2.12 no abre volúmenes LUKS2 con Argon2 (los que crea cryptsetup por defecto) y el
# arranque cae a la consola de GRUB; Debian mantiene LUKS1 para /boot cifrado por este motivo.
luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
