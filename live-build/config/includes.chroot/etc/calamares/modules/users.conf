# Usuario creado por Calamares (sustituye al fichero de calamares-settings-debian): mismos grupos
# que el usuario en vivo (docker y wireshark incluidos) y contraseña mínima razonable para una
# estación de trabajo de seguridad.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - docker
    - wireshark
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: 10
    maxLength: -1
    libpwquality:
        - minlen=10
        - minclass=2
