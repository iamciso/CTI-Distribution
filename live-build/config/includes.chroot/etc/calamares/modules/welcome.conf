# Requisitos de instalación (sustituye al fichero de calamares-settings-debian): la imagen
# descomprimida ocupa unos 15 GiB, así que 15 GiB de disco no bastan (la instalación fallaba al
# regenerar el initramfs por falta de espacio).
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
requirements:
    requiredStorage:    30
    requiredRam:        3.5
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
