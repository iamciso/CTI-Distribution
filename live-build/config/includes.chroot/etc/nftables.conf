#!/usr/sbin/nft -f
# Política base: nada entra salvo lo relacionado con conexiones salientes.
# La tabla se llama "ctidistro" y no "filter" a propósito: OpenSnitch y otros servicios crean
# "inet filter input" con política accept y, si compartiesen nombre, sobrescribirían la nuestra.
flush ruleset

table inet ctidistro {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp icmp type { echo-request } limit rate 5/second accept
        ip6 nexthdr icmpv6 accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
