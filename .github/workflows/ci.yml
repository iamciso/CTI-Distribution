name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: make lint

  check-packages:
    name: Paquetes existen en Debian trixie
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq git
      - run: tests/check-packages.sh

  validate-config:
    name: lb config valida
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq live-build
      - name: Generar configuración
        working-directory: live-build
        run: lb config && ls config/
      - name: Validar JSON de políticas de Firefox
        run: python3 -m json.tool live-build/config/includes.chroot/etc/firefox-esr/policies/policies.json >/dev/null
