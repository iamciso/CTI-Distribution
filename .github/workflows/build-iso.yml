name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: live-build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Construir ISO en contenedor debian:trixie
        run: |
          docker run --rm --privileged \
            -v "$PWD/live-build:/build" -w /build \
            debian:trixie bash -euxc '
              apt-get update -qq
              apt-get install -y -qq live-build
              lb build
              ls -lh *.iso
              sha256sum *.iso > SHA256SUMS
            '

      - name: Publicar ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ctidistro-iso
          path: |
            live-build/*.iso
            live-build/SHA256SUMS
            live-build/build.log
          retention-days: 7
          compression-level: 0

      - name: Adjuntar a la release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            live-build/*.iso
            live-build/SHA256SUMS
