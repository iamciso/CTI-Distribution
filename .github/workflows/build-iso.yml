name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: live-build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # "secrets" no se puede usar en las condiciones "if" de los pasos; se expone como variable
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Construir ISO en contenedor debian:trixie
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" -w /repo/live-build \
            debian:trixie bash -euxc '
              apt-get update -qq
              apt-get install -y -qq live-build curl jq ca-certificates
              lb build
              ls -lh *.iso
              sha256sum *.iso > SHA256SUMS
              # SBOM e informe de vulnerabilidades del sistema de ficheros de la imagen
              # (un fallo aquí no debe impedir publicar la ISO)
              sh /repo/tools/release/sbom.sh /repo/live-build/chroot /repo/live-build/sbom \
                || echo "AVISO: no se pudo generar el SBOM"
              mkdir -p sbom && cp *.packages sbom/ 2>/dev/null || true
            '

      - name: Publicar ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ctidistro-iso
          path: |
            live-build/*.iso
            live-build/SHA256SUMS
            live-build/build.log
          retention-days: 7
          compression-level: 0

      - name: Publicar SBOM e informe de vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: ctidistro-sbom
          path: live-build/sbom/
          retention-days: 30

      - name: Firmar SHA256SUMS (solo tags, si existe el secreto GPG_PRIVATE_KEY)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output live-build/SHA256SUMS.asc live-build/SHA256SUMS
          gpg --verify live-build/SHA256SUMS.asc live-build/SHA256SUMS

      - name: Adjuntar a la release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            live-build/*.iso
            live-build/SHA256SUMS
            live-build/SHA256SUMS.asc
            live-build/sbom/ctidistro.spdx.json
            live-build/sbom/ctidistro.cdx.json
            live-build/sbom/vulns-summary.txt
            live-build/sbom/*.packages
